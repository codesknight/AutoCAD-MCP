name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests (CAD tests require explicit opt-in)
        shell: pwsh
        run: |
          python -m pytest -q 2>&1 | Tee-Object -Variable pytestOutput
          $pytestExit = $LASTEXITCODE
          if ($pytestExit -ne 0) {
            $details = ($pytestOutput -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Offline pytest output::$details"
          }
          exit $pytestExit
  bridge-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify Bridge journal contracts without AutoCAD
        run: dotnet run --project plugin/AutoCADBridge.ContractTests -c Release
      - name: Verify embedded Kestrel lifecycle without a UI message pump
        run: dotnet run --project plugin/AutoCADBridge.HostingTests -c Release
      - name: Verify pagination cursor integrity and lifetime
        run: dotnet run --project plugin/AutoCADBridge.CursorTests -c Release
      - name: Verify artifact paths and no-replace file publication
        run: dotnet run --project plugin/AutoCADBridge.ArtifactTests -c Release
